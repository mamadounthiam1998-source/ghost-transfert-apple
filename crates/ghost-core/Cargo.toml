[package]
name = "ghost-core"
version = "0.1.0"
edition = "2021"
description = "Coeur de Ghost Transfert Apple : cryptographie, securite, transfert, sauvegarde, appareils"
license = "UNLICENSED"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tar = "0.4"
fs4 = "0.12"
ed25519-dalek = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
