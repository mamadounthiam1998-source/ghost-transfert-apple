name: Tests et installateurs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (coeur Rust + interface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Tests du coeur (cryptographie, sécurité, transfert, sauvegarde)
        run: cargo test -p ghost-core --locked
      - name: Clippy
        run: cargo clippy -p ghost-core --all-targets --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typage TypeScript
        run: npm run typecheck
      - name: Tests de l'interface
        run: npm test
      - name: Compilation de l'interface
        run: npm run build

  installateurs:
    name: Installateur ${{ matrix.name }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: ""
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.args }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Installer libimobiledevice (MSYS2, Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-libimobiledevice
      - name: Embarquer les outils Apple dans l'installateur (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          dest="$GITHUB_WORKSPACE/src-tauri/resources/tools"
          mkdir -p "$dest"
          for t in idevice_id ideviceinfo idevicebackup2 idevicepair; do
            test -f "/mingw64/bin/$t.exe" || { echo "::error::$t.exe absent du paquet MSYS2"; exit 1; }
            cp "/mingw64/bin/$t.exe" "$dest/"
          done
          # Outils facultatifs : batterie (cycles/santé) et capture d'écran
          for t in idevicediagnostics idevicescreenshot; do
            if [ -f "/mingw64/bin/$t.exe" ]; then cp "/mingw64/bin/$t.exe" "$dest/"; else echo "::warning::$t.exe absent du paquet MSYS2"; fi
          done
          # DLL dépendantes : tout ce qui vient de /mingw64
          for f in "$dest"/*.exe; do
            ldd "$f" | awk '/\/mingw64\// {print $3}'
          done | sort -u | while read -r f; do cp "$f" "$dest/"; done
          ls -la "$dest"
      - name: Vérifier que les outils embarqués démarrent sans MSYS2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = "$env:GITHUB_WORKSPACE\src-tauri\resources\tools"
          # PATH minimal : seuls les fichiers embarqués peuvent être utilisés
          $env:PATH = "$tools;$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($t in "idevice_id","ideviceinfo","idevicebackup2","idevicepair","idevicediagnostics","idevicescreenshot") {
            if (-not (Test-Path "$tools\$t.exe")) { Write-Warning "$t absent (facultatif)"; continue }
            & "$tools\$t.exe" --version
            if ($LASTEXITCODE -ne 0) { Write-Error "$t ne démarre pas (code $LASTEXITCODE)"; exit 1 }
          }
      - name: Construction de l'application et des installateurs
        run: npx tauri build ${{ matrix.args }}
      - name: Publication des installateurs (artefacts)
        uses: actions/upload-artifact@v4
        with:
          name: ghost-transfert-apple-${{ matrix.os }}-${{ contains(matrix.args, 'x86_64') && 'x64' || (contains(matrix.args, 'aarch64') && 'arm64' || 'x64') }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/*/release/bundle/dmg/*.dmg
